[package]
name = "openfortivpn-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.76"

[[bin]]
name = "openfortivpn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
nix = { version = "0.29", features = ["fs", "net", "poll", "process", "signal", "term"] }
foreign-types = "0.3"
openssl = "0.10"
openssl-sys = "0.9"
smoltcp = { version = "0.11", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
